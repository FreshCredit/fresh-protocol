# The Fresh Protocol — workspace root.
#
# Open-source edge-infrastructure protocol (AUTH → DID → DB → HASH).
# Maintained by The FreshCredit Org; dual Apache-2.0/MIT (see LICENSE-*).

[workspace]
resolver = "2"
members = [
    "crates/fresh-protocol-spec",
    "crates/types",
    "crates/security",
    "crates/timing",
    "crates/libsql-common",
    "crates/libsql-local",
    "crates/libsql-cloud",
    "crates/db-migrations",
    "crates/libsql-schema-validator",
    "crates/consistency",
    # Group 5 — auth + middleware
    "crates/auth",
    "crates/middleware/consent",
    "crates/middleware/idempotency",
    "crates/middleware/rate_limit",
    "crates/middleware/session",
    # Group 6 — anchoring client
    "crates/blockchain-client",
    # Group 8 — node + NOMT stack
    "crates/blockchain-node",
    "crates/freshcredit-nomt-core",
    "crates/nomt-client",
    "crates/nomt-server",
    "crates/nomt-sidecar",
    "crates/nomt-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FreshCredit/fresh-protocol"
description = "The Fresh Protocol — open-source edge infrastructure"
readme = "README.md"
keywords = ["fresh-protocol", "edge-infrastructure", "did", "libsql"]
categories = ["finance", "web-programming"]

[workspace.dependencies]
# In-repo crates
freshcredit-core-timing = { path = "crates/timing", version = "0.1.0" }
freshcredit-libsql-common = { path = "crates/libsql-common", version = "0.1.0" }
freshcredit-libsql-local = { path = "crates/libsql-local", version = "0.1.0" }
freshcredit-libsql-cloud = { path = "crates/libsql-cloud", version = "0.1.0" }
freshcredit-db-migrations = { path = "crates/db-migrations", version = "0.1.0" }
freshcredit-libsql-schema-validator = { path = "crates/libsql-schema-validator", version = "0.1.0" }
freshcredit-consistency = { path = "crates/consistency", version = "0.1.0" }
regex = "1.10"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.51", features = ["full", "test-util"] }
clap = { version = "4.6", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
blake2 = "0.10"
hex = "0.4"
sha2 = "0.10"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = ">=0.8.6, <0.9.0"
dashmap = "6.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
libsql = { git = "https://github.com/FreshCredit/libsql.git", rev = "9e6dacfa60e1dac0781bcf7aa68034deffcb0dd8" }
# Group-2 crates (consumed from group 2 in-repo)
freshcredit-types = { path = "crates/types", version = "0.1.0" }
freshcredit-security = { path = "crates/security", version = "0.1.0" }

# Group 5 — web stack for auth + middleware
axum = { version = "0.7", features = ["macros", "tracing"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
hmac = "0.12"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
http = "1.0"
bytes = "1.9"
http-body-util = "0.1"
mockall = "0.13"
tokio-test = "0.4"

# Group 6 — anchoring client (Substrate/subxt + NOMT sidecar)
subxt = "0.50"
subxt-rpcs = "0.50"
subxt-signer = { version = "0.50", features = ["subxt", "sr25519"] }
sp-crypto-hashing = "0.1"
wiremock = "0.6"
sp-core-hashing = "5.0"

# Group 8 — node + NOMT stack
futures = "0.3.30"
tower_governor = "0.5"
governor = "0.8"
once_cell = "1.19"
dotenvy = "0.15"
prometheus = "0.13"
prost = "0.13"
tonic = "0.12"
tonic-build = "0.12"
nomt = "0.2"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
getrandom = "0.2"
serial_test = "3.0"
serde_test = "1.0"
url = "2.5"
askama = "0.14"
blake3 = "1.5"
tempfile = "3.8"

# Quality gate lints — kept lockstep with the reference implementation's
# workspace lints so protocol crates satisfy the same bar.
[workspace.lints.rust]
missing_docs = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -3 }
unsafe_code = { level = "deny", priority = 0 }

[workspace.lints.clippy]
multiple_crate_versions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 2 }
missing_docs = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -3 }
unsafe_code = { level = "deny", priority = 0 }
