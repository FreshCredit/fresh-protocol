# The Fresh Protocol — workspace root.
#
# Open-source edge-infrastructure protocol (AUTH → DID → DB → HASH).
# Maintained by The FreshCredit Org; dual Apache-2.0/MIT (see LICENSE-*).

[workspace]
resolver = "2"
members = [
    "crates/fresh-protocol-spec",
    "crates/types",
    "crates/security",
    "crates/timing",
    "crates/libsql-common",
    "crates/libsql-local",
    "crates/libsql-cloud",
    "crates/db-migrations",
    "crates/libsql-schema-validator",
    "crates/consistency",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FreshCredit/fresh-protocol"
description = "The Fresh Protocol — open-source edge infrastructure"
readme = "README.md"
keywords = ["fresh-protocol", "edge-infrastructure", "did", "libsql"]
categories = ["finance", "web-programming"]

[workspace.dependencies]
# In-repo crates
freshcredit-core-timing = { path = "crates/timing", version = "0.1.0" }
freshcredit-libsql-common = { path = "crates/libsql-common", version = "0.1.0" }
freshcredit-libsql-local = { path = "crates/libsql-local", version = "0.1.0" }
freshcredit-libsql-cloud = { path = "crates/libsql-cloud", version = "0.1.0" }
freshcredit-db-migrations = { path = "crates/db-migrations", version = "0.1.0" }
freshcredit-libsql-schema-validator = { path = "crates/libsql-schema-validator", version = "0.1.0" }
freshcredit-consistency = { path = "crates/consistency", version = "0.1.0" }
regex = "1.10"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.51", features = ["full", "test-util"] }
clap = { version = "4.6", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
blake2 = "0.10"
hex = "0.4"
sha2 = "0.10"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = ">=0.8.6, <0.9.0"
dashmap = "6.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
libsql = { git = "https://github.com/FreshCredit/libsql.git", rev = "9e6dacfa60e1dac0781bcf7aa68034deffcb0dd8" }
# Group-2 crates (consumed from group 2 in-repo)
freshcredit-types = { path = "crates/types", version = "0.1.0" }
freshcredit-security = { path = "crates/security", version = "0.1.0" }

# Quality gate lints — kept lockstep with the reference implementation's
# workspace lints so protocol crates satisfy the same bar.
[workspace.lints.rust]
missing_docs = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -3 }
unsafe_code = { level = "deny", priority = 0 }

[workspace.lints.clippy]
multiple_crate_versions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 2 }
missing_docs = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -3 }
unsafe_code = { level = "deny", priority = 0 }
