[package]
name = "freshcredit-security"
version = "0.1.0"
edition = "2021"

[dependencies]
blake2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
aes-gcm = "0.10"
rand = "0.8"
base64 = { workspace = true }
tracing.workspace = true
clap = { workspace = true, optional = true }

# Re-export clock from timing crate to avoid duplication
freshcredit-core-timing = { path = "../timing" }

[features]
default = []
cli = ["clap"]

[[bin]]
name = "fc-security"
path = "src/bin/fc_security.rs"
required-features = ["cli"]
