[package]
name = "freshcredit-libsql-common"
version = "0.1.0"
edition = "2021"
description = "Shared utilities for libSQL/Turso database connections with dual-path architecture"

[features]
# Default: Direct remote + local-only (embedded replica is OPT-IN)
default = ["remote", "local-only", "embedded-replica"]

# Individual features
remote = []              # Direct HTTP connection to Turso (always available by default)
embedded-replica = []    # Local cache with background sync (OPT-IN)
local-only = []          # Pure local SQLite (for testing/fallback)

# Convenience feature groups
dual-path = ["remote", "embedded-replica", "local-only"]
full = ["remote", "embedded-replica", "local-only"]

# Deprecated: 'replica' is renamed to 'embedded-replica'
replica = ["embedded-replica"]

[dependencies]
# Core dependencies
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }

# Database
libsql = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
