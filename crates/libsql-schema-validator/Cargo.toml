[package]
name = "freshcredit-libsql-schema-validator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "validate-schema"
path = "src/bin/validate_schema.rs"

[dependencies]
anyhow = "1.0"
libsql = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

