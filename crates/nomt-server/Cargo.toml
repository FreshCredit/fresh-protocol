[package]
name = "nomt-server"
version.workspace = true
edition.workspace = true
description = "NOMT server-side storage implementation"
authors = ["FreshCredit Team <dev@freshcredit.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/FreshCredit/beta"

readme.workspace = true
keywords.workspace = true
categories.workspace = true
[features]
default = ["native"]
native = []
legacy = ["tokio/fs"]

[dependencies]
freshcredit-nomt-core = { path = "../freshcredit-nomt-core", version = "0.1.0" }

# Core async runtime
tokio = { workspace = true, features = ["rt", "sync", "io-util", "fs"] }
async-trait = { workspace = true }

# Serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Hashing
blake3 = "1.5.5"
hex = { workspace = true }

# NOMT library (optional, for native feature)
# Note: NOMT is currently at version 1.0.x, using placeholder for now
# nomt = { version = "1.0", optional = true }

# Tracing
tracing = { workspace = true }

# Date/time
chrono = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio-test = "0.4.4"
tempfile = "3.16.0"
tokio = { workspace = true, features = ["rt", "sync", "io-util", "fs", "macros"] }

[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-hack"]
