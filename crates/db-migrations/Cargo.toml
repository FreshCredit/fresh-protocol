[package]
name = "freshcredit-db-migrations"
version = "0.1.0"
edition = "2021"
description = "Versioned database migration system for FreshCredit"

[[bin]]
name = "run-migrations"
path = "src/bin/run_migrations.rs"

[dependencies]
anyhow = "1.0"
libsql = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tokio = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.10"

